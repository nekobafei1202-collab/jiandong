[project]
name = "jiandong-ai"
version = "1.0.0"
description = "健动 AI — Python/Flet rewrite of the Flutter fitness coach (camera + pose + coaching)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flet>=0.25.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
jiandong-ai = "jiandong_ai.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.flet.app]
include = ["assets", "models", "android_bridge"]
exclude = [".tts-venv", ".speech-cache", "_test_assistant_tmp*", "_test_voice_tmp*", "_voice_eval_tmp*", "_phone_run", "_apk_inspect", "_diag_videos", "_backup", "_*.png", "_*.xml", "_*.txt", "*.log", "storage", "jiandong_data.json", "ai_config.json", "tests", "models/*.onnx", "models/pose_landmarker_lite.task"]

# Use the platform-channel implementation until the JNI path works on-device.
[tool.flet.flutter.pubspec.dependency_overrides]
path_provider_android = "2.2.23"
jni = "1.1.0"
